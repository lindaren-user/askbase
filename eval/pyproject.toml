[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askbase-retrieval-eval"
version = "0.1.0"
description = "Public benchmark evaluation of AskBase retrieval"
requires-python = ">=3.10"
dependencies = ["ir-measures>=0.3,<1"]

[project.optional-dependencies]
download = ["datasets>=3,<5", "huggingface-hub>=0.30,<2"]

[project.scripts]
askbase-retrieval-eval = "askbase_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
