services:
  frontend:
    build:
      context: .
      dockerfile: ./fe/Dockerfile
    image: askbase-frontend:local
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-askbase}
      POSTGRES_USER: ${POSTGRES_USER:-askbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbase_password}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./be/data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-askbase}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-askbase_password}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - ./be/data/rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # 独立迁移任务；成功退出后其余后端进程才会启动。
  backend-migrate:
    build:
      context: .
      dockerfile: ./be/Dockerfile
    image: askbase-backend:local
    command: ["/app/askbase-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.yaml
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-askbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbase_password}
      POSTGRES_DB: ${POSTGRES_DB:-askbase}
    volumes:
      - ./be/config.yaml:/app/config.yaml:ro
    restart: "no"

  # HTTP API 仅写 PostgreSQL Outbox，不直接依赖 RabbitMQ。
  backend-api:
    build:
      context: .
      dockerfile: ./be/Dockerfile
    image: askbase-backend:local
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      CONFIG_FILE: /app/config.yaml
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-askbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbase_password}
      POSTGRES_DB: ${POSTGRES_DB:-askbase}
      AUTH_SECRET: ${AUTH_SECRET:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - ./be/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # 文档解析消费者；默认单 Pod 并发 1。
  backend-worker:
    build:
      context: .
      dockerfile: ./be/Dockerfile
    image: askbase-backend:local
    command: ["/app/askbase-worker"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.yaml
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-askbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbase_password}
      POSTGRES_DB: ${POSTGRES_DB:-askbase}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-askbase}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-askbase_password}
      RABBITMQ_VHOST: /
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      VISION_API_KEY: ${VISION_API_KEY:-}
      MINERU_TOKEN: ${MINERU_TOKEN:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
    volumes:
      - ./be/config.yaml:/app/config.yaml:ro
    restart: unless-stopped

  # 事务 Outbox relay；与 API、worker 独立重启和扩缩容。
  backend-relay:
    build:
      context: .
      dockerfile: ./be/Dockerfile
    image: askbase-backend:local
    command: ["/app/askbase-relay"]
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.yaml
      APP_ENV: ${APP_ENV:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-askbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askbase_password}
      POSTGRES_DB: ${POSTGRES_DB:-askbase}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-askbase}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-askbase_password}
      RABBITMQ_VHOST: /
    volumes:
      - ./be/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
